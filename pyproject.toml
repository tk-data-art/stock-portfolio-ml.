[tool.poetry]
name = "stock-portfolio-ml"
version = "0.1.0"
description = "Production-grade ML stock forecasting and portfolio optimization"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "stock_portfolio", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.4"
yfinance = "^0.2.40"
prophet = "^1.1.5"
cvxpy = "^1.5.0"
supabase = "^2.5.0"
streamlit = "^1.36.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.3.0"
plotly = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pandas-stubs = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "plotly.*",
    "prophet.*",
    "cvxpy.*",
    "streamlit.*",
]
ignore_missing_imports = true
